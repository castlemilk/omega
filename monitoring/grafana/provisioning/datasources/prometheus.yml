apiVersion: 1

datasources:
  # ── Prometheus ──────────────────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: traceID

  # ── PostgreSQL (Omega shared DB — Victoria + intelligence data) ─────────────
  - name: PostgreSQL
    type: grafana-postgresql-datasource
    access: proxy
    uid: postgres
    url: omega-postgres:5432
    user: ${POSTGRES_USER:-omega}
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-omega}
    jsonData:
      database: ${POSTGRES_DB:-omega}
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: false

  # ── Tempo (distributed traces) ──────────────────────────────────────────────
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: ""
