global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "omega"

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # Go API — Prometheus /metrics endpoint on the Connect-RPC server
  - job_name: "omega-go-api"
    static_configs:
      - targets: ["omega-api:8080"]
        labels:
          layer: "go"
    metrics_path: /metrics
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          layer: "infra"
