services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: omega-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"   # expose on 9091 to avoid clashing with the Python exporter on 9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - omega-monitoring

  grafana:
    image: grafana/grafana:10.4.2
    container_name: omega-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=omega
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/omega-overview.json
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - omega-monitoring

volumes:
  prometheus_data:
    name: omega_prometheus_data
  grafana_data:
    name: omega_grafana_data

networks:
  omega-monitoring:
    name: omega-monitoring
    driver: bridge
