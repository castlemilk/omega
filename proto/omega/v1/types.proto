syntax = "proto3";

package omega.v1;

option go_package = "github.com/benebsworth/omega/gen/go/omega/v1;omegav1";

import "google/protobuf/timestamp.proto";

// ── Nodes ──────────────────────────────────────────────────────────────────

message Node {
  string node_id = 1;
  string name = 2;
  string version = 3;
  repeated string capabilities = 4;
  double health = 5;
  string status = 6;
  google.protobuf.Timestamp registered_at = 7;
  google.protobuf.Timestamp last_updated = 8;
  int64 executions_total = 9;
  double error_rate = 10;
  double avg_latency_ms = 11;
  double p95_latency_ms = 12;
  int64 improvement_count = 13;
  ExecutionRecord last_execution = 14;
  CircuitBreakerState circuit_breaker = 15;
}

message ExecutionRecord {
  string exec_id = 1;
  string node_id = 2;
  string node_name = 3;
  string trace_id = 4;
  string span_id = 5;
  string action = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp ended_at = 8;
  double duration_ms = 9;
  bool success = 10;
  string error_text = 11;
  map<string, double> metrics = 12;
  int64 cycle = 13;
}

// ── Traces ─────────────────────────────────────────────────────────────────

message TraceSummary {
  string trace_id = 1;
  google.protobuf.Timestamp trace_started = 2;
  google.protobuf.Timestamp trace_ended = 3;
  double total_duration_ms = 4;
  int64 span_count = 5;
  int64 error_spans = 6;
  int64 cycle = 7;
}

message Span {
  string span_id = 1;
  string trace_id = 2;
  string parent_span_id = 3;
  string node_id = 4;
  string node_name = 5;
  string operation = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp ended_at = 8;
  double duration_ms = 9;
  string status = 10;
  int64 cycle = 11;
}

// ── Issues ─────────────────────────────────────────────────────────────────

message Issue {
  string issue_id = 1;
  string detector = 2;
  string severity = 3;
  string description = 4;
  string state = 5;
  google.protobuf.Timestamp opened_at = 6;
  google.protobuf.Timestamp resolved_at = 7;
  int64 cycle_opened = 8;
  int64 cycle_resolved = 9;
}

// ── Activity ───────────────────────────────────────────────────────────────

message ActivityEntry {
  string log_id = 1;
  string action_type = 2;
  string entity_type = 3;
  string entity_id = 4;
  google.protobuf.Timestamp recorded_at = 5;
  int64 cycle = 6;
}

// ── Improvements ──────────────────────────────────────────────────────────

message ImprovementRecord {
  string improve_id = 1;
  string node_id = 2;
  string node_name = 3;
  string from_version = 4;
  string to_version = 5;
  string triggered_by = 6;
  google.protobuf.Timestamp recorded_at = 7;
  int64 cycle = 8;
  map<string, double> before_metrics = 9;
  map<string, double> after_metrics = 10;
}

// ── System health ──────────────────────────────────────────────────────────

message SystemHealth {
  string status = 1;
  double composite_score = 2;
  double avg_node_health = 3;
  int64 node_count = 4;
  int64 open_issues = 5;
  int64 error_issues = 6;
  double uptime_seconds = 7;
  int64 total_cycles = 8;
}

// ── Memory ─────────────────────────────────────────────────────────────────

message SemanticConcept {
  string concept = 1;
  string content = 2;
  double confidence = 3;
  int64 evidence_count = 4;
  repeated string tags = 5;
}

message EpisodeEntry {
  string episode_id = 1;
  string event_type = 2;
  google.protobuf.Timestamp timestamp = 3;
  int64 cycle = 4;
  double importance = 5;
  repeated string tags = 6;
}

// ── Convergence ────────────────────────────────────────────────────────────

message ConvergencePoint {
  int64 cycle = 1;
  google.protobuf.Timestamp timestamp = 2;
  double score = 3;
  double pipeline_ms = 4;
}

// ── Costs ──────────────────────────────────────────────────────────────────

message CostEntry {
  string provider = 1;
  string node_id = 2;
  int64 calls = 3;
  double total_ms = 4;
  double total_cost_usd = 5;
}

// ── Events (for streaming) ─────────────────────────────────────────────────

message EventResponse {
  string type = 1;
  oneof payload {
    SystemHealth health_update = 2;
    Node node_update = 3;
    Issue new_issue = 4;
    ImprovementRecord improvement = 5;
    ActivityEntry activity = 6;
  }
}

// ── LLM Brain config ───────────────────────────────────────────────────────

message BrainConfig {
  string provider = 1;
  string model = 2;
  double temperature = 3;
  int32 max_tokens = 4;
  string system_prompt = 5;
  map<string, string> extra_config = 6;
}

message NodeConfig {
  string node_id = 1;
  string node_type = 2;
  BrainConfig brain = 3;
  map<string, string> parameters = 4;
  string version = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message BrainExecutionEntry {
  string exec_id = 1;
  string node_id = 2;
  string provider = 3;
  string model = 4;
  int64 prompt_tokens = 5;
  int64 completion_tokens = 6;
  double latency_ms = 7;
  bool success = 8;
  string error_text = 9;
  google.protobuf.Timestamp executed_at = 10;
  int64 cycle = 11;
}

message ProviderInfo {
  string id = 1;
  string display_name = 2;
  repeated string models = 3;
  bool requires_api_key = 4;
  bool available = 5;
}

// ── Alignment ─────────────────────────────────────────────────────────────────

message AlignmentDecision {
  string decision_id = 1;
  int64 cycle = 2;
  bool approved = 3;
  repeated string reasons = 4;
  string target_subsystem = 5;
  google.protobuf.Timestamp recorded_at = 6;
}

// ── Adversarial ───────────────────────────────────────────────────────────────

message AdversarialResult {
  string result_id = 1;
  int64 cycle = 2;
  int32 ring = 3;
  repeated string flags = 4;
  string severity = 5;
  google.protobuf.Timestamp recorded_at = 6;
}

// ── Goal tracking ─────────────────────────────────────────────────────────────

message GoalState {
  int64 cycle = 1;
  map<string, bool> constitutional_checks = 2;
  map<string, double> scorecard_values = 3;
  repeated string active_tasks = 4;
  google.protobuf.Timestamp recorded_at = 5;
}

// ── Challenges ────────────────────────────────────────────────────────────────

message Challenge {
  string challenge_id = 1;
  string status = 2;
  string severity = 3;
  string target_subsystem = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ── Memory stats ──────────────────────────────────────────────────────────────

message MemoryStats {
  int64 episodic_count = 1;
  int64 semantic_count = 2;
  repeated string regime_history = 3;
  int64 contradiction_count = 4;
}

// ── Verification gates ────────────────────────────────────────────────────────

message GateResult {
  string gate_id = 1;
  int64 cycle = 2;
  string gate_name = 3;
  string result = 4;
  string details = 5;
  google.protobuf.Timestamp checked_at = 6;
}

// ── Circuit breaker ────────────────────────────────────────────────────────────

// CircuitBreakerState captures the current state of a node's circuit breaker.
message CircuitBreakerState {
  // state is one of "CLOSED", "OPEN", or "HALF_OPEN".
  string state = 1;
  // failure_count is the number of consecutive failures recorded.
  int32 failure_count = 2;
  // last_failure_time is when the last failure was recorded (zero if never).
  google.protobuf.Timestamp last_failure_time = 3;
}

// ── Node capability & status ───────────────────────────────────────────────────

// NodeCapability describes a functional role a node can perform.
enum NodeCapability {
  NODE_CAPABILITY_UNSPECIFIED  = 0;
  NODE_CAPABILITY_SIGNAL_RESEARCH = 1;
  NODE_CAPABILITY_RISK_MANAGEMENT = 2;
  NODE_CAPABILITY_DATA_INGESTION  = 3;
  NODE_CAPABILITY_STRATEGY        = 4;
  NODE_CAPABILITY_VERIFICATION    = 5;
  NODE_CAPABILITY_ADVERSARIAL     = 6;
  NODE_CAPABILITY_MEMORY          = 7;
  NODE_CAPABILITY_IMPROVEMENT     = 8;
}

// NodeStatus reflects the current operational state of a registered node.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_STARTING    = 1;
  NODE_STATUS_HEALTHY     = 2;
  NODE_STATUS_DEGRADED    = 3;
  NODE_STATUS_OFFLINE     = 4;
  NODE_STATUS_STOPPING    = 5;
}

// NodeRegistration is the canonical record the orchestrator keeps for each
// connected intelligence node.
message NodeRegistration {
  string id                           = 1;
  string name                         = 2;
  string language                     = 3;  // "go" | "python" | "typescript" etc.
  repeated NodeCapability capabilities = 4;
  string address                      = 5;  // host:port the node listens on
  double health_score                 = 6;  // [0.0, 1.0]
  google.protobuf.Timestamp last_heartbeat = 7;
  string autonomy_level               = 8;  // mirrors AutonomyLevel enum value name
  string version                      = 9;
  NodeStatus status                   = 10;
  map<string, string> metadata        = 11;
  google.protobuf.Timestamp registered_at = 12;
}

// ── Projects ────────────────────────────────────────────────────────────────

// PipelineStep is one ordered step in a project's execution pipeline.
// node_type references a NodeCapability enum name (e.g. "DATA_INGESTION").
message PipelineStep {
  string step_id     = 1;
  string name        = 2;
  string node_type   = 3;
  string description = 4;
  int32  order       = 5;
  map<string, string> config = 6;
}

// EvalConfig declares which metrics matter for a project and their targets.
message EvalConfig {
  repeated string         primary_metrics = 1;
  map<string, double>     metric_targets  = 2;
  string                  eval_frequency  = 3; // "per_cycle" | "daily" | "weekly"
}

// ImprovementConfig controls how Omega's improvement engine runs for a project.
message ImprovementConfig {
  bool   tpe_enabled           = 1;
  int32  tpe_trials            = 2;
  bool   adversarial_enabled   = 3;
  int32  adversarial_rounds    = 4;
  bool   walk_forward_enabled  = 5;
  map<string, string> extra    = 6;
}

// Project is a configured instance driven by the Omega platform.
// Omega owns orchestration, eval, and self-improvement; Projects declare WHAT runs.
message Project {
  string project_id     = 1;
  string name           = 2;
  string description    = 3;
  // status: "active" | "paused" | "archived"
  string status         = 4;
  // domain: "crypto_quant" | "macro_research" | "options_arb" | "custom"
  string domain         = 5;
  // autonomy_level mirrors NodeRegistration.autonomy_level
  string autonomy_level = 6;
  // node_ids references nodes in the global Omega node registry
  repeated string       node_ids        = 7;
  repeated PipelineStep pipeline_config = 8;
  EvalConfig            eval_config     = 9;
  ImprovementConfig     improvement_config = 10;
  google.protobuf.Timestamp created_at  = 11;
  google.protobuf.Timestamp updated_at  = 12;
  map<string, string>   metadata        = 13;
}

// ── Improvement detail (with alignment context) ───────────────────────────────

message ImprovementDetail {
  string improve_id = 1;
  string node_id = 2;
  string node_name = 3;
  string from_version = 4;
  string to_version = 5;
  string triggered_by = 6;
  google.protobuf.Timestamp recorded_at = 7;
  int64 cycle = 8;
  map<string, double> before_metrics = 9;
  map<string, double> after_metrics = 10;
  bool alignment_approved = 11;
  bool has_alignment_decision = 12;
  repeated string alignment_reasons = 13;
}
