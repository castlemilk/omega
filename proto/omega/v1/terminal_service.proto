syntax = "proto3";

package omega.v1;

option go_package = "github.com/benebsworth/omega/gen/go/omega/v1;omegav1";

import "google/protobuf/timestamp.proto";

// TerminalService manages sandboxed terminal sessions for LLM-driven command
// execution within Omega's graduated autonomy model.
service TerminalService {
  rpc CreateSession(CreateSessionRequest)         returns (CreateSessionResponse);
  rpc ExecuteCommand(ExecuteCommandRequest)       returns (ExecuteCommandResponse);
  rpc CloseSession(CloseSessionRequest)           returns (CloseSessionResponse);
  rpc ListSessions(ListSessionsRequest)           returns (ListSessionsResponse);
  rpc GetSessionHistory(GetSessionHistoryRequest) returns (GetSessionHistoryResponse);
}

// ── Session config ──────────────────────────────────────────────────────────

message SessionConfig {
  string session_id       = 1; // caller-supplied or server-generated UUID
  string work_dir         = 2; // working directory for all commands
  map<string, string> env = 3; // extra environment variables
  repeated string allowed_cmds   = 4; // command prefix whitelist (empty = level default)
  repeated string blocked_cmds   = 5; // extra command prefix blacklist (merged with defaults)
  int64 timeout_seconds          = 6; // max session lifetime (default 600s)
  int64 cmd_timeout_seconds      = 7; // max per-command runtime (default 30s)
  string autonomy_level          = 8; // "pico" | "supervised" | "autonomous"
  int64 max_output_bytes         = 9; // default 1_048_576 (1 MiB)
}

message TerminalSession {
  string id                        = 1;
  SessionConfig config             = 2;
  google.protobuf.Timestamp created_at = 3;
  string status                    = 4; // "active" | "closed" | "timed_out"
}

// ── CreateSession ───────────────────────────────────────────────────────────

message CreateSessionRequest  { SessionConfig config = 1; }
message CreateSessionResponse { TerminalSession session = 1; }

// ── ExecuteCommand ──────────────────────────────────────────────────────────

message ExecuteCommandRequest {
  string session_id    = 1;
  string command       = 2;
  repeated string args = 3;
  string stdin         = 4;
  string reason        = 5; // LLM's stated reason for running this command
  string cycle_id      = 6; // Omega cycle for traceability
}

message ExecuteCommandResponse {
  string session_id  = 1;
  string command     = 2;
  int32  exit_code   = 3;
  string stdout      = 4;
  string stderr      = 5;
  int64  duration_ms = 6;
  bool   truncated   = 7;
  string error       = 8; // set if command was blocked or failed to start
  string trace_id    = 9;
}

// ── CloseSession ────────────────────────────────────────────────────────────

message CloseSessionRequest  { string session_id = 1; }
message CloseSessionResponse { bool ok = 1; }

// ── ListSessions ────────────────────────────────────────────────────────────

message ListSessionsRequest  {}
message ListSessionsResponse { repeated TerminalSession sessions = 1; }

// ── GetSessionHistory ───────────────────────────────────────────────────────

message GetSessionHistoryRequest  { string session_id = 1; }
message GetSessionHistoryResponse {
  TerminalSession session              = 1;
  repeated ExecuteCommandResponse commands = 2;
}
