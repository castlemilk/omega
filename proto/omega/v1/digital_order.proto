syntax = "proto3";

package omega.v1;

option go_package = "github.com/benebsworth/omega/gen/go/omega/v1;omegav1";

// The provider's test environment is explicit in every exported receipt.
enum DigitalPaymentState {
  DIGITAL_PAYMENT_STATE_UNSPECIFIED = 0;
  DIGITAL_PAYMENT_STATE_PENDING = 1;
  DIGITAL_PAYMENT_STATE_PAID = 2;
  DIGITAL_PAYMENT_STATE_FAILED = 3;
  DIGITAL_PAYMENT_STATE_EXPIRED = 4;
  DIGITAL_PAYMENT_STATE_REFUNDED = 5;
  DIGITAL_PAYMENT_STATE_DISPUTED = 6;
  DIGITAL_PAYMENT_STATE_CANCELLED = 7;
}

message DigitalOffer {
  string business_id = 1;
  string product_id = 2;
  string edition = 3;
  string packet_sha256 = 4;
  string archive_sha256 = 5;
  string archive_name = 6;
  int64 amount_minor = 7;
  string currency = 8;
  string licence = 9;
}

message DigitalOrderEvent {
  string provider_event_id = 1;
  string event_type = 2;
  string processing_status = 3;
  uint32 attempts = 4;
  string received_at = 5;
}

message DigitalOrderReceipt {
  string order_id = 1;
  DigitalOffer offer = 2;
  bool test_mode = 3;
  DigitalPaymentState payment = 4;
  int64 refunded_minor = 5;
  string entitlement_id = 6;
  bool download_available = 7;
  string download_expires_at = 8;
  uint32 downloads_issued = 9;
  string provider_session_id = 10;
  string provider_payment_id = 11;
  string provider_charge_id = 12;
  string verified_at = 13;
  repeated DigitalOrderEvent events = 14;
  string dispute_status = 15;
  // Whether this same checkout can still be resumed or cancelled.
  bool checkout_open = 16;
}
