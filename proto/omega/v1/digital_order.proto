syntax = "proto3";

package omega.v1;

import "google/protobuf/wrappers.proto";

option go_package = "github.com/benebsworth/omega/gen/go/omega/v1;omegav1";

// The provider's test environment is explicit in every exported receipt.
enum DigitalPaymentState {
  DIGITAL_PAYMENT_STATE_UNSPECIFIED = 0;
  DIGITAL_PAYMENT_STATE_PENDING = 1;
  DIGITAL_PAYMENT_STATE_PAID = 2;
  DIGITAL_PAYMENT_STATE_FAILED = 3;
  DIGITAL_PAYMENT_STATE_EXPIRED = 4;
  DIGITAL_PAYMENT_STATE_REFUNDED = 5;
  DIGITAL_PAYMENT_STATE_DISPUTED = 6;
  DIGITAL_PAYMENT_STATE_CANCELLED = 7;
}

message DigitalOffer {
  string business_id = 1;
  string product_id = 2;
  string edition = 3;
  string packet_sha256 = 4;
  string archive_sha256 = 5;
  string archive_name = 6;
  int64 amount_minor = 7;
  string currency = 8;
  string licence = 9;
}

message DigitalOrderEvent {
  string provider_event_id = 1;
  string event_type = 2;
  string processing_status = 3;
  uint32 attempts = 4;
  string received_at = 5;
}

message DigitalOrderReceipt {
  string order_id = 1;
  DigitalOffer offer = 2;
  bool test_mode = 3;
  DigitalPaymentState payment = 4;
  int64 refunded_minor = 5;
  string entitlement_id = 6;
  bool download_available = 7;
  string download_expires_at = 8;
  uint32 downloads_issued = 9;
  string provider_session_id = 10;
  string provider_payment_id = 11;
  string provider_charge_id = 12;
  string verified_at = 13;
  repeated DigitalOrderEvent events = 14;
  string dispute_status = 15;
  // Whether this same checkout can still be resumed or cancelled.
  bool checkout_open = 16;
}

// Each movement uses its Stripe balance transaction's own settlement currency.
message CommerceBalanceMovement {
  string id = 1;
  string kind = 2; // charge or refund
  string occurred_at = 3;
  string currency = 4;
  int64 amount_minor = 5;
  int64 fee_minor = 6;
  int64 net_minor = 7;
}

message CommerceStatementOrder {
  string order_id = 1;
  string created_at = 2;
  string edition = 3;
  string packet_sha256 = 4;
  string archive_sha256 = 5;
  string currency = 6;
  int64 quoted_minor = 7;
  DigitalPaymentState payment = 8;
  // Both values are absent when current payment evidence is inconclusive.
  google.protobuf.Int64Value captured_minor = 9;
  google.protobuf.Int64Value refunded_minor = 10;
  uint32 downloads_issued = 11;
  uint32 processed_events = 12;
  uint32 unresolved_events = 13;
  google.protobuf.StringValue verified_at = 14;
  google.protobuf.StringValue dispute_status = 15;
  bool balance_complete = 16;
  repeated CommerceBalanceMovement movements = 17;
}

// Membership uses order creation in the inclusive UTC window. Financial and
// fulfilment evidence are current as of verification, across all editions.
message CommerceStatement {
  string schema = 1;
  string business_id = 2;
  string product_id = 3;
  bool test_mode = 4;
  string from_day = 5;
  string through_day = 6;
  string verified_at = 7;
  repeated CommerceStatementOrder orders = 8;
  string coverage = 9; // complete, partial or empty
  uint32 unresolved_scope_orders = 10;
}

// A receiver acknowledges the stored statement or an identical observation.
message CommerceReporterReceipt {
  string outcome = 1; // saved or unchanged
  string statement_id = 2;
  string checked_at = 3;
}
