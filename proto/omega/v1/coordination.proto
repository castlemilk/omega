syntax = "proto3";

package omega.v1;

option go_package = "github.com/benebsworth/omega/gen/go/omega/v1;omegav1";

import "google/protobuf/timestamp.proto";
import "omega/v1/state_tensor.proto";

// ── Goal types ───────────────────────────────────────────────────────────────

enum GoalType {
  GOAL_TYPE_UNSPECIFIED = 0;
  GOAL_TYPE_RESEARCH    = 1;  // hypothesis → experiment → evaluate
  GOAL_TYPE_IMPROVEMENT = 2;  // improve a specific metric
  GOAL_TYPE_MAINTENANCE = 3;  // keep a metric within bounds
  GOAL_TYPE_INCIDENT    = 4;  // respond to a safety violation or anomaly
  GOAL_TYPE_COMPOSITION = 5;  // cross-node composition goal
}

// GoalSpec is the routing-layer view of a goal.
// It carries what the coordinator needs to make an attention-based routing decision.
message GoalSpec {
  string   goal_id           = 1;
  string   description       = 2;
  GoalType type              = 3;
  float    priority          = 4;  // 0.0–1.0
  // context: current metric values relevant to routing (e.g. "sharpe": 0.8)
  map<string, float> context = 5;
  // requires_autonomy: if true, only route to nodes with trust_score >= 0.7
  bool requires_autonomy     = 6;
  // required_capabilities: verbs this goal must reach
  repeated string required_capabilities = 7;
}

// ── Routing plan ─────────────────────────────────────────────────────────────

// RoutingPlan is the coordinator's decision on how to route a goal.
message RoutingPlan {
  // primary_node is the node_id of the highest-weight candidate.
  string primary_node              = 1;
  // node_weights maps node_id → attention weight (softmax output α).
  map<string, float> node_weights  = 2;
  // confidence is max(α) — below 0.6 triggers escalation.
  float confidence                 = 3;
  // routing_vector is the α·V weighted value sum (reserved for v3 composition).
  repeated float routing_vector    = 4;
}

// ── Outcome record ───────────────────────────────────────────────────────────

// OutcomeRecord persists the (goal, routing, outcome) tuple for future training.
message OutcomeRecord {
  string      record_id             = 1;
  GoalSpec    goal                  = 2;
  RoutingPlan routing_plan          = 3;
  // outcome_quality is a scalar in [−1, 1] representing the observed outcome.
  // Positive = better than baseline; negative = worse.
  float       outcome_quality       = 4;
  google.protobuf.Timestamp captured_at = 5;
  // state_snapshot maps node_id → StateTensor at routing time (for training).
  map<string, StateTensor> state_snapshot = 6;
}

// ── CoordinationService RPCs ─────────────────────────────────────────────────

service CoordinationService {
  // Route selects the best node(s) for a given goal using the active router.
  rpc Route(CoordinationRequest) returns (CoordinationResponse);
  // RecordOutcome stores an outcome tuple for future router training.
  rpc RecordOutcome(RecordCoordinationOutcomeRequest) returns (RecordCoordinationOutcomeResponse);
  // GetRoutingStats returns aggregate routing statistics.
  rpc GetRoutingStats(GetRoutingStatsRequest) returns (GetRoutingStatsResponse);
}

// ── Route RPC ────────────────────────────────────────────────────────────────

message CoordinationRequest {
  GoalSpec goal               = 1;
  // candidate_node_ids: if empty, all registered nodes are considered.
  repeated string candidate_node_ids = 2;
  // trace_id for distributed tracing correlation.
  string trace_id             = 3;
}

message CoordinationResponse {
  RoutingPlan  plan           = 1;
  string       trace_id       = 2;
}

// ── RecordOutcome RPC ────────────────────────────────────────────────────────

message RecordCoordinationOutcomeRequest {
  OutcomeRecord record = 1;
}

message RecordCoordinationOutcomeResponse {
  string record_id = 1;
}

// ── GetRoutingStats RPC ──────────────────────────────────────────────────────

message GetRoutingStatsRequest {
  // since filters to records after this time; zero = all time.
  google.protobuf.Timestamp since = 1;
}

message GetRoutingStatsResponse {
  int64  total_routes         = 1;
  int64  outcome_records      = 2;
  float  avg_confidence       = 3;
  // training_eligible: true when outcome_records >= 1000 (attention model can be retrained).
  bool   training_eligible    = 4;
}
