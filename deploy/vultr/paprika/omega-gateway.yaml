# GatewayClass for Envoy Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# Gateway for Paprika. Cloudflare terminates TLS at the edge (real cert) and
# proxies to this LB on HTTPS (port 443) with a self-signed origin cert.
# Cloudflare SSL mode: Full (allows self-signed origin certs).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: paprika
  namespace: envoy-gateway-system
  annotations:
    gateway.envoyproxy.io/envoyproxy: envoy-gateway-system/custom-proxy-config
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: paprika-tls
            namespace: paprika-e2e
          - kind: Secret
            name: babybub-api-tls
            namespace: babybub
          - kind: Secret
            name: tautau-stt-tls
            namespace: tautau
          - kind: Secret
            name: dh-cert-dom-deephost-benebsworth-com-tls
            namespace: deephost
          - kind: Secret
            name: dh-wildcard-apps-deephost-benebsworth-com-tls
            namespace: deephost
          - kind: Secret
            name: dh-cert-dom-www-deephost-benebsworth-com-tls
            namespace: deephost
          - kind: Secret
            name: dh-cert-dom-e2e-remote-apps-deephost-benebsworth-com-tls
            namespace: deephost
          - kind: Secret
            name: dh-cert-dom-resource-check-apps-deephost-benebsworth-com-tls
            namespace: deephost
          - kind: Secret
            name: dh-cert-dom-smoke3-one-shot-apps-deephost-benebsworth-com-tls
            namespace: deephost
          - kind: Secret
            name: deephost-grafana-tls
            namespace: deephost
          - kind: Secret
            name: deephost-console-tls
            namespace: deephost
          - kind: Secret
            name: dh-cert-dom-bbaceb3cd2255fcb00c4e55f5cdd50b7-tls
            namespace: deephost
          - kind: Secret
            name: dns-tls
            namespace: dns
          - kind: Secret
            name: dh-cert-dom-live-benebsworth-com-tls
            namespace: deephost
          - kind: Secret
            name: dh-cert-dom-www-live-benebsworth-com-tls
            namespace: deephost
      allowedRoutes:
        namespaces:
          from: All
