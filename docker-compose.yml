name: omega

volumes:
  omega-pgdata:

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  omega-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omega
      POSTGRES_USER: omega
      POSTGRES_PASSWORD: omega
    volumes:
      - omega-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omega -d omega"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Python heartbeat loop ────────────────────────────────────────────────────
  omega-nodes:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://omega:omega@omega-postgres:5432/omega?sslmode=disable
      OMEGA_API_BASE_URL: http://omega-api:8080
      OMEGA_JSON_LOGS: "true"
    depends_on:
      omega-postgres:
        condition: service_healthy
      omega-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import psycopg, os; conn=psycopg.connect(os.environ['DATABASE_URL']); conn.execute('SELECT 1'); conn.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Go Connect-RPC API ───────────────────────────────────────────────────────
  omega-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://omega:omega@omega-postgres:5432/omega?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      omega-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── React/Vite dashboard ─────────────────────────────────────────────────────
  omega-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Vite proxy target — overrides vite.config.ts proxy at runtime
      VITE_API_URL: http://omega-api:8080
    depends_on:
      omega-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
