name: omega

# Shared SQLite volume — Python writes, Go reads from the same files.
# Mount point: /data in both omega-nodes and omega-api.
volumes:
  omega-data:

services:

  # ── Python heartbeat loop ────────────────────────────────────────────────────
  omega-nodes:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      OMEGA_STATE_DB_PATH: /data/omega_victoria_state.db
      OMEGA_MEMORY_DB_PATH: /data/omega_victoria_memory.db
      OMEGA_DB_PATH: /data/omega_victoria.db
      OMEGA_API_BASE_URL: http://omega-api:8080
      OMEGA_JSON_LOGS: "true"
    volumes:
      - omega-data:/data
    depends_on:
      omega-api:
        condition: service_healthy
    healthcheck:
      # Python process writes state DB on first cycle; poll for it
      test: ["CMD", "python3", "-c", "import sqlite3, os; sqlite3.connect(os.environ.get('OMEGA_STATE_DB_PATH','/data/omega_victoria_state.db'))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Go Connect-RPC API ───────────────────────────────────────────────────────
  omega-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      OMEGA_STATE_DB_PATH: /data/omega_victoria_state.db
      OMEGA_MEMORY_DB_PATH: /data/omega_victoria_memory.db
    ports:
      - "8080:8080"
    volumes:
      - omega-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── React/Vite dashboard ─────────────────────────────────────────────────────
  omega-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Vite proxy target — overrides vite.config.ts proxy at runtime
      VITE_API_URL: http://omega-api:8080
    depends_on:
      omega-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
