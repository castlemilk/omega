# Why this exists.
#
# scripts/ci.sh has run pytest, ruff, mypy, go vet and go test for a long time,
# and nothing ever invoked it — there was no workflow, and no git hook. The cost
# of that was measured rather than guessed: 54 standing test failures, a mypy step
# that aborted inside a numpy stub and therefore checked ZERO project files while
# reporting success, and ten test files so slow (they made live network calls)
# that `pytest tests/` looked like it hung.
#
# So the fast suite runs on every push. The slow suite runs nightly, because it
# takes ~15 minutes and its value is catching drift, not blocking a commit.
#
# mypy and ruff are NOT gates yet: there is a standing backlog that surfaced the
# moment the type checker started working. They run in report-only mode so the
# number is visible and can be driven down, and should be promoted to blocking
# once it reaches zero. A gate that fails on day one gets disabled on day two.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * *" # 00:00 AEST — the slow suite

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: python (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (unit only)
        # Excludes three marker sets, all defined in pyproject.toml:
        #   slow        real multi-cycle simulations, ~15 min — nightly job below
        #   integration needs external services
        #   e2e         needs the Go API server and Postgres running
        # The first run of this workflow excluded only `slow` and hit 7 errors from
        # test_e2e_eval trying to reach localhost:5432 and start a Go binary.
        run: python -m pytest tests/ -q -m "not slow and not integration and not e2e" --no-header
      - name: substrate is unchanged
        # The suite used to write data/macro_cache.db and the memory DB — files
        # that are committed and asserted by data/.cache_manifest.json. If a test
        # writes them again, fail here rather than discovering it in someone's
        # working tree days later.
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "::error::the test run modified committed data/ files"
            git status --porcelain data/
            exit 1
          fi

  slow:
    name: python (slow, nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (slow only)
        run: python -m pytest tests/ -q -m "slow" --no-header

  quality:
    name: lint + types (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        # BLOCKING: the backlog is cleared (113 -> 0), so this is a gate now.
        run: ruff check omega/ tests/
      - name: mypy (omega, blocking)
        # BLOCKING: omega/ is at zero.
        run: mypy omega/
      - name: mypy (tests, report only)
        # pyproject declares files = ["omega", "tests"], so tests/ was always in
        # scope and simply never surfaced. Report-only until that backlog is
        # cleared, then fold both into a single blocking `mypy` step.
        continue-on-error: true
        run: mypy tests/

  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        # Blocking from the start: 25 packages, 0 failures at the time this was
        # added, so there is no backlog to phase in.
        run: go test ./...
