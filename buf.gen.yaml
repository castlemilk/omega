version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/es
    out: dashboard/src/gen
    opt:
      - target=ts
  - remote: buf.build/connectrpc/es
    out: dashboard/src/gen
    opt:
      - target=ts
# Python bindings (betterproto) are NOT generated via buf because the
# betterproto plugin is not available as a buf remote plugin.
# Run:  make proto-python
# Requires:  uv pip install "betterproto[compiler]"
# Output:    gen/python/omega/v1.py  (betterproto dataclasses)
