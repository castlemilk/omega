id: polymarket
name: Polymarket
domain: prediction_markets
status: active
autonomy_level: pico

pipeline_config:
  - step_id: step_1
    name: WeatherData
    node_type: WEATHER_ENSEMBLE
    description: Fetch GEFS ensemble data and compute temperature exceedance probabilities
    order: 1
  - step_id: step_2
    name: MarketPricing
    node_type: POLYMARKET_PRICING
    description: Fetch live weather market prices from Polymarket Gamma API
    order: 2
  - step_id: step_3
    name: EdgeDetection
    node_type: EDGE_DETECTION
    description: Compare model probabilities vs market prices and flag edges
    order: 3
  - step_id: step_4
    name: RiskCheck
    node_type: RISK_MANAGEMENT
    description: Validate position sizes via Kelly criterion
    order: 4

eval_config:
  primary_metrics:
    - edge_accuracy
    - avg_edge
  metric_targets:
    edge_accuracy: 0.6
    avg_edge: 0.08
