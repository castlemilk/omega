# projects/victoria.yaml
# ──────────────────────────────────────────────────────────────
# Victoria — Crypto Quantitative Trading
#
# Declarative project definition.  Wire existing node types
# together; no platform code changes required to add a node.
#
# To run:  omega run --project projects/victoria.yaml
# To add a node: add an entry under `nodes:` and connect it.
# ──────────────────────────────────────────────────────────────

name: victoria
description: Autonomous crypto quantitative research and trading system

nodes:
  # ── Data layer ──────────────────────────────────────────────
  - type: data_provider
    name: market_feed
    config:
      provider: binance          # primary; falls back to CoinGecko / Bybit
      tickers:
        - BTCUSDT
        - ETHUSDT
        - SOLUSDT
        - BNBUSDT
        - XRPUSDT
        - ADAUSDT
        - DOTUSDT
        - AVAXUSDT
        - LINKUSDT
        - MATICUSDT

  # ── Regime detection ────────────────────────────────────────
  - type: regime_detector
    name: regime
    inputs: [market_feed.market_data]
    config:
      algorithm: wasserstein

  # ── Signal layer ─────────────────────────────────────────────
  - type: signal_generator
    name: basic_signals
    inputs:
      - market_feed.market_data
      - regime.regime
    config:
      signals: [basic]           # RSI, MACD, Bollinger Bands, Z-score, BTC-beta

  - type: signal_generator
    name: geometric_signals
    inputs:
      - market_feed.market_data
      - regime.regime
    config:
      signals: [spectral]        # Spectral-graph, Riemannian curvature

  - type: signal_generator
    name: smart_money
    inputs:
      - market_feed.market_data
    config:
      signals: [smart_money]     # Whale flow, order-block detection

  - type: signal_generator
    name: sentiment_signals
    inputs:
      - market_feed.market_data
    config:
      signals: [sentiment]       # FinBERT news + Twitter sentiment

  - type: signal_generator
    name: vrp_signals
    inputs:
      - market_feed.market_data
    config:
      signals: [vrp]             # Variance Risk Premium

  # ── Strategy layer ───────────────────────────────────────────
  - type: strategy
    name: conviction_strategy
    inputs:
      - basic_signals.signal_value
      - basic_signals.confidence
      - geometric_signals.signal_value
      - geometric_signals.confidence
      - smart_money.signal_value
      - smart_money.confidence
      - sentiment_signals.signal_value
      - vrp_signals.signal_value
      - regime.regime
    config:
      min_conviction: 0.6
      max_positions: 9

  # ── Risk layer ───────────────────────────────────────────────
  - type: risk_manager
    name: risk_controls
    inputs:
      - conviction_strategy.trade_decision
      - conviction_strategy.position_weights
    config:
      max_drawdown: 0.15
      max_position_pct: 0.20
      kelly_fraction: 0.25

  # ── Execution layer ──────────────────────────────────────────
  - type: executor
    name: paper_trader
    inputs:
      - risk_controls.approved_decision
    config:
      mode: paper
      max_positions: 9

routing:
  type: dag                      # nodes run in topological dependency order
  config: {}

# ──────────────────────────────────────────────────────────────
# Evaluation and improvement (used by omega eval / omega train)
# ──────────────────────────────────────────────────────────────
eval_config:
  primary_metrics:
    - sharpe_ratio
    - ic
    - max_drawdown
    - win_rate
  metric_targets:
    sharpe_ratio: 1.5
    ic: 0.05
    max_drawdown: -0.15
  eval_frequency: per_cycle

improvement_config:
  tpe_enabled: true
  tpe_trials: 50
  adversarial_enabled: true
  adversarial_rounds: 3
  walk_forward_enabled: true

metadata:
  color: "#00ff00"
  domain: crypto_quant
  autonomy_level: supervised
