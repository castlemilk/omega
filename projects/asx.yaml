# projects/asx.yaml
# ──────────────────────────────────────────────────────────────
# ASX — Australian equities research system
#
# A PROJECT definition (CLAUDE.md "Platform vs Project Separation").
# Forked from Victoria's METHOD — walk-forward, frozen substrate,
# pre-registered gates — but explicitly NOT its model: V286 measured
# that Victoria's one working signal does not transfer to the ASX.
#
# STATUS: data layer only. No signal or strategy node is declared
# here, deliberately. Nothing about the ASX price signal is validated
# yet (V286 §5: the headline reversion finding may be pure
# survivorship bias), and declaring a strategy node for a strategy
# that does not exist is how a scaffold becomes a claim.
# ──────────────────────────────────────────────────────────────

name: asx
description: Australian equities research — frozen-substrate data layer (pre-signal)

metadata:
  fork_of: victoria           # method, not model
  status: data-layer-only
  first_finding: omega/nodes/victoria/training_log/V286_PHASE0_ASX.md
  blocking_question: survivorship-free universe (V286 §5)

nodes:
  # ── Data layer ──────────────────────────────────────────────
  - type: data_provider
    name: asx_bars
    config:
      provider: yfinance          # daily bars, auto-adjusted (splits + dividends)
      interval: 1d
      frozen_root: data/frozen_series/asx
      # The universe is survivorship-BIASED by construction and is flagged as such
      # in the manifest. It is for plumbing and smoke tests only — never a verdict.
      universe: asx20_today
      universe_survivorship_safe: false

  # ── Metadata: short positions (Shorted API) ────────────────
  # ASIC short-position data via https://shorted.com.au/docs/api
  # (Connect-RPC over JSON POST, the same framework this repo speaks).
  # Token is MANDATORY: their usage policy states automated access
  # requires a valid API token, and GetStockData — the only endpoint
  # returning HISTORY — is private. Read from OMEGA_SHORTED_API_KEY;
  # never stored in this file, never committed.
  - type: data_provider
    name: asx_short_positions
    enabled: false                # no token provisioned yet
    config:
      provider: shorted
      base_url: https://api.shorted.com.au
      package: shorts.v1alpha1
      history_method: GetStockData      # private — requires token
      # Surface read from the docs 2026-08-28. Two discoveries matter most:
      #  MarketService.GetAvailableDates + GetMarketByDate — IF these return the
      #    market AS OF a date including later-delisted names, they address the
      #    survivorship problem V286 §5 flagged as blocking the ASX thesis.
      #    That is a hypothesis to TEST, not an established fact.
      #  NewsService.GetStockNews / GetMarketNews — the news surface the brief
      #    asked for. Historical depth UNKNOWN and must be measured first: V287 §1
      #    found the free yfinance metadata was recent-only, hence unbacktestable.
      services_to_confirm: [MarketService, NewsService, StockService]
      token_env: OMEGA_SHORTED_API_KEY
      frozen_root: data/frozen_series/asx/shorts
      # Free tier 1,000 req/month is the binding constraint: fine for a
      # 20-name study, not for a daily-refreshed ASX-300 universe.
      rate_limit_note: "free 60/min 1000/mo; $20 tier 120/min 10000/mo"

# ── Not yet declared, and why ───────────────────────────────────
# signals:  no signal node until a survivorship-free universe confirms or kills
#           V286 §3's reversion finding. See training_log/V287.md §3.
# metadata: news / announcements / fundamentals are NOT historically available on
#           the free path (measured 2026-08-27) — recent-only news, forward-only
#           calendar, point-in-time `info`. Backtesting on them would be lookahead.
#           A metadata node waits on an acquired source WITH history.
