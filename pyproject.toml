[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega"
version = "0.1.0"
description = "Project Omega — self-improving node orchestration framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []   # stdlib only: abc, dataclasses, sqlite3, urllib, uuid, math, logging

[project.optional-dependencies]
math = [
    "numpy>=1.26",
]
telemetry = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = [
    "numpy>=1.26",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omega*"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -n auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests requiring external services",
    "e2e: end-to-end tests against the running Go API server",
]

[tool.coverage.run]
source = ["omega"]
omit = ["omega/examples/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces flake8, isort, black)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 99
target-version = "py311"
exclude = ["omega/examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments
    "SIM108", # ternary operator — sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = ["omega"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# Mypy — type checking (non-strict, disallow_untyped_defs = true)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["omega", "tests"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
pretty = true

# Third-party stubs are optional; don't fail on missing
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated protobuf code — skip entirely
module = ["gen.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Test files: relax untyped_defs — test methods rarely annotate -> None
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Example scripts — not production code, skip strict checks
module = ["omega.examples.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# data_providers: heavy use of dynamic dict keys from external API responses
module = ["omega.nodes.vectora.data_providers"]
ignore_errors = true

[[tool.mypy.overrides]]
# Pre-existing signature incompatibility issues — suppressed pending refactor
module = ["omega.core.state_store"]
ignore_errors = true

[[tool.mypy.overrides]]
# Pre-existing no-any-return issues in math helpers — suppressed pending refactor
module = ["omega.core.memory_v2"]
ignore_errors = true

[[tool.mypy.overrides]]
# Bridge clients return untyped dicts from JSON HTTP responses — no-any-return suppressed
module = ["omega.bridge.*"]
warn_return_any = false
