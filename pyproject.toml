[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega"
version = "0.1.0"
description = "Project Omega — self-improving node orchestration framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []   # stdlib only: abc, dataclasses, sqlite3, urllib, uuid, math, logging

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omega*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["omega"]
omit = ["omega/examples/*"]
